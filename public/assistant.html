<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glimty assistant</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="assistant-page">
  <div class="wrap">
    <header class="site-header">
      <a class="logo" href="/"><span class="mark">G</span> Glimty</a>
      <nav>
        <a href="/#how">How it works</a>
        <button class="btn btn-dark" type="button" id="start-over">Start over</button>
      </nav>
    </header>

    <section class="assistant-shell" id="assistant-root">
      <div class="chat-head">
        <div>
          <strong>Your gift assistant</strong>
          <span>Finds a gift, wraps it, or keeps the dates</span>
        </div>
        <a class="icon-btn" href="/" aria-label="Back to Glimty home">←</a>
      </div>
      <div class="brief" data-brief></div>
      <div class="transcript" data-transcript></div>
      <form class="composer" data-composer>
        <label class="visually-hidden" for="assistant-input">Message</label>
        <input id="assistant-input" name="message" autocomplete="off" placeholder="Tell me who it’s for, or pick a path above">
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </section>
  </div>
  <script src="/js/chat.js"></script>
  <script>
    const chat = GlimtyChat.mount(document.getElementById('assistant-root'), { storageKey: 'glimty.full' });
    document.getElementById('start-over')?.addEventListener('click', () => {
      chat?.reset();
      window.location.reload();
    });
  </script>
</body>
</html>
